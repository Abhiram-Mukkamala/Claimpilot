name: ClaimPilot backend tests

on:
  push:
    paths:
      - "insurance-pro/backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "insurance-pro/backend/**"
      - "supabase/migrations/**"
      - ".github/workflows/backend-tests.yml"

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend and schema regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Intentionally fake credentials. The suite uses mocked database/auth
      # dependencies and must not connect to the live Supabase project.
      SUPABASE_URL: https://unit-test.invalid
      SUPABASE_ANON_KEY: test-anon-key
      SUPABASE_SERVICE_ROLE_KEY: test-service-key
      JWT_SECRET: test-secret-key-minimum-32-characters-long
      ENVIRONMENT: test
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: insurance-pro/backend/requirements.txt

      - name: Install backend requirements
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
        working-directory: insurance-pro/backend

      - name: Run backend regression suite
        run: python -m pytest -q
        working-directory: insurance-pro/backend
